<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="myn.css">

<body>

  <header class="navbar">
    <img src="image 1.png" alt="">
    <nav class="nav-links">
      <a href="#">static</a>

      <a href="#">absolute</a>
      <a href="#">fixed</a>
      <a href="#">sticky</a>
      <a href="#">z-index</a>
    </nav>
  </header>

  <section class="position-section">
    <div class="pill-title">Position</div>

    <div class="boxes-container">
      <div class="box-pair">
        <div class="green-box relative-box">
          <span>relative</span>
        </div>
        <div class="red-box absolute-box">
          <span>absolute</span>
        </div>
      </div>

      <div class="box-pair">
        <div class="green-box relative-box">
          <span>relative</span>
        </div>
        <div class="red-box absolute-box rounded-box">
          <span>absolute</span>
        </div>
      </div>

      <div class="box-pair">
        <div class="green-box relative-box">
          <span>relative</span>
        </div>
        <div class="red-box absolute-box">
          <span>absolute</span>
        </div>
      </div>
    </div>
  </section>

  <section class="info-section">
    <div class="pill-title">Information</div>

    <div class="cards-container">
      <div class="card">
        <h3>Static</h3>
        <p class="static-text">
          Postion default holati static bu holatda top ,left right,bottom ,z-index ishlamaydi

      </div>

      <div class="card">
        <h3>Relative</h3>
        <div class="card-image-box">
          <img src="image 3.png" alt="Relative Information Image">
        </div>
      </div>

      <div class="card">
        <h3>Obsolute</h3>
        <div class="card-image-box">
          <img src="image 2 (2).png" alt="Absolute Information Image">
        </div>
      </div>
    </div>

  <footer class="footer">
    <img src="image 1.png" alt="">
    <div class="footer-links">
      <span>top</span>
      <span>left</span>
      <span>right</span>
      <span>bottom</span>
    </div>
  </footer>
